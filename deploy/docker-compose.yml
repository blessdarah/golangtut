services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_app
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-myapp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:latest
    container_name: migrate_app
    command: ["-path", "/db/migrations", "-database", "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable", "up"]
    volumes:
      - ../internal/db/migrations:/db/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: dev
    container_name: go_app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ..:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
